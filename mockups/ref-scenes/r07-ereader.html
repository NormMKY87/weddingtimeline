<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><title>E-reader</title>
<link rel="stylesheet" href="lib.css">
<style>
  /* Inspired by: a slim tablet seen straight on against a warm olive wall, cropped by the
     bottom of the frame, a soft shadow to the left, the page shown as an e-book. */
  body { --bg: var(--surf-olive); --bg-light: linear-gradient(100deg, rgb(255 255 255 / .1), rgb(255 255 255 / 0) 50%, rgb(0 0 0 / .05)); }
  .tab { position: absolute; left: 322px; top: 104px; width: 556px; height: 820px; border-radius: 38px; background: linear-gradient(90deg, #2a2725, #121110 6%, #121110 94%, #2a2725); padding: 11px; box-sizing: border-box; z-index: 5;
    box-shadow: inset 0 0 0 1.5px #4a4642, inset 0 2px 1px rgb(255 255 255 / .18); }
  .tab .scr { width: 100%; height: 100%; border-radius: 22px; overflow: hidden; background: var(--white); position: relative; }
  .tab .scr img { display: block; width: 100%; height: auto; }
  .tab .scr::after { content: ""; position: absolute; inset: 0; background: linear-gradient(125deg, rgb(255 255 255 / .16), rgb(255 255 255 / 0) 30%), rgb(238 228 212 / .35); mix-blend-mode: multiply; }
  .sh1 { position: absolute; z-index: 4; left: 286px; top: 124px; width: 556px; height: 820px; border-radius: 38px; background: rgb(var(--shadow-rgb) / .45); filter: blur(24px); }
  .sh2 { position: absolute; z-index: 4; left: 312px; top: 110px; width: 556px; height: 820px; border-radius: 38px; background: rgb(var(--shadow-rgb) / .35); filter: blur(6px); }
</style></head>
<body><div class="env sh1"></div><div class="env sh2"></div>
<div class="tab"><div class="scr"></div></div>
<div class="grain" style="--grain:.45"></div>
<script src="lib.js"></script>
<script>document.querySelector('.tab .scr').innerHTML = img(P.R);</script>
</body></html>
